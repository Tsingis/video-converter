name: release
on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "**.props"
      - "global.json"
      - ".github/workflows/release.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "**.props"
      - "global.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json
      - name: Restore dependencies
        run: dotnet restore
      - name: Publish Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $RID = "win-x64"
          $OUT = "video-converter-win.zip"
          dotnet publish -c Release -r $RID
          Compress-Archive -Path ./publish/* -DestinationPath $OUT -Force
          echo "PACKAGE_PATH=$OUT" >> $env:GITHUB_ENV
      - name: Publish Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          RID=linux-x64
          OUT=video-converter-linux.tar.gz
          dotnet publish -c Release -r $RID
          tar -czvf $OUT -C ./publish .
          echo "PACKAGE_PATH=$OUT" >> $GITHUB_ENV
      - name: Upload artifacts
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.os }}-package
          path: ${{ env.PACKAGE_PATH }}
          overwrite: true
          retention-days: 1
          if-no-files-found: error
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    env:
      TAG: v1.0.0
      TITLE: Video Converter
      NOTES: Download latest version
    steps:
      - uses: actions/checkout@v5
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./packages
      - name: Create release
        shell: bash
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" --latest --title "$TITLE" --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload packages
        shell: bash
        run: |
          for f in ./packages/*/*; do
            gh release upload "$TAG" "$f" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
